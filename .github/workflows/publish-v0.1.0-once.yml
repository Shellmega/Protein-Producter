name: Publish the verified v0.1.0 package once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.1.0-once.yml']
permissions: {}
concurrency: publish-v0-1-0
jobs:
  release:
    if: github.repository == 'Shellmega/Protein-Producter' && github.event.before == 'ee8a53ddab44f6c2a5a1be1d5f4bf167f66c907b'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch and verify the previously published files
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://raw.githubusercontent.com/Shellmega/Protein-Producter'
          package_url="$source_url/8a674421abb244f54d4a0ecd5db1290e7df2bad2/downloads"
          zip='Protein-Producter-v0.1.0-Windows.zip'
          curl --fail --silent --show-error --location --retry 3 "$package_url/$zip" -o "$zip"
          curl --fail --silent --show-error --location --retry 3 "$package_url/SHA256SUMS.txt" -o SHA256SUMS.txt
          curl --fail --silent --show-error --location --retry 3 "$source_url/d0d1aaad374a23e238679b56cfac666294e5fb20/releases/v0.1.0.md" -o notes.md
          printf '%s  %s\n' 'ecdbb58fb078f759f3943070b90b6144ce9a711545acea92f033d423491650ef' "$zip" > expected.txt
          cmp expected.txt SHA256SUMS.txt
          sha256sum --check expected.txt
      - name: Publish Windows ZIP and SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.0 Protein-Producter-v0.1.0-Windows.zip SHA256SUMS.txt \
            --repo Shellmega/Protein-Producter \
            --target d0d1aaad374a23e238679b56cfac666294e5fb20 \
            --title "Protein-Producter v0.1.0" --notes-file notes.md
