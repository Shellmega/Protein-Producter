name: Verify the Windows v0.1.1 distribution
on:
  push:
    branches: [main]
    paths: ['.github/workflows/portable-v0.1.1-once.yml']
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'Shellmega/Protein-Producter' && github.event.before == 'a9212b52b928b0f56278321959cfcaaa82b2d1d9'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Read the fixed source commit
        shell: pwsh
        run: |
          git -c core.autocrlf=false init .
          git -c core.autocrlf=false fetch --no-tags --depth=1 https://github.com/Shellmega/Protein-Producter.git a9212b52b928b0f56278321959cfcaaa82b2d1d9
          git -c core.autocrlf=false checkout --detach FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and run clean Windows startup and migration tests
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'portable'
          $zip = Join-Path $out 'Protein-Producter-v0.1.1-Windows.zip'
          python -B -X utf8 GraphToProtein/tests/demo/test_sketch_selection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -X utf8 package_release.py $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -X utf8 test_windows_release.py $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content (Join-Path $out 'SHA256SUMS.txt')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-windows-v0.1.1
          path: ${{ runner.temp }}/portable/
          if-no-files-found: error
          retention-days: 4
          compression-level: 0
