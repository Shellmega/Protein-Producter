name: Build, verify and publish portable Windows v0.1.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/portable-v0.1.1-once.yml']
permissions: {}
concurrency: portable-v0-1-1
jobs:
  build:
    if: github.repository == 'Shellmega/Protein-Producter' && github.event.before == '4223a953bcb8f1b24884fe272f3bb1867509b9f0'
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Fetch approved source
        shell: pwsh
        run: |
          git init .
          git fetch --no-tags --depth=1 https://github.com/Shellmega/Protein-Producter.git 4223a953bcb8f1b24884fe272f3bb1867509b9f0
          git -c core.autocrlf=false checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD) -ne '4223a953bcb8f1b24884fe272f3bb1867509b9f0') { throw 'Source mismatch' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build, test startup, and move the extracted ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'portable/Protein-Producter-v0.1.1-Windows.zip'
          python -B -X utf8 GraphToProtein/tests/demo/test_sketch_selection.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -X utf8 package_release.py $zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -X utf8 test_windows_release.py $zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content (Join-Path $env:RUNNER_TEMP 'portable/SHA256SUMS.txt')
      - name: Verify first-use downloads against the same SHA-256 values as the app
        shell: python
        run: |
          import hashlib, sys, time
          from urllib.request import urlopen
          sys.path.insert(0, "GraphToProtein/demo")
          import model_setup as s
          for name,url,expected in [(s.TORCH_NAME,s.TORCH_URL,s.TORCH_HASH),(s.WEIGHT_NAME,s.WEIGHT_URL,s.WEIGHT_HASH)]:
              for attempt in range(3):
                  try:
                      with urlopen(url,timeout=90) as stream:
                          h=hashlib.file_digest(stream, "sha256").hexdigest()
                      if h!=expected: raise ValueError(name+" SHA-256 mismatch")
                      print(name,h,flush=True)
                      break
                  except OSError:
                      if attempt==2: raise
                      time.sleep(3)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-portable-windows
          path: ${{ runner.temp }}/portable/
          if-no-files-found: error
          retention-days: 4
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-portable-windows
          path: package
      - name: Publish the checked ZIP and its checksum
        working-directory: package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Shellmega/Protein-Producter/4223a953bcb8f1b24884fe272f3bb1867509b9f0/releases/v0.1.1.md -o notes.md
          gh release create v0.1.1 Protein-Producter-v0.1.1-Windows.zip SHA256SUMS.txt --repo Shellmega/Protein-Producter --target 4223a953bcb8f1b24884fe272f3bb1867509b9f0 --title "Protein-Producter v0.1.1 · Windows 便携版" --notes-file notes.md
